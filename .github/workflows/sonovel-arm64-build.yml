name: Build so-novel arm64 image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（默认 arm64）'
        required: false
        default: 'arm64'

env:
  ACR_REGISTRY: crpi-bmp6dgle5p1egr1w.cn-shenzhen.personal.cr.aliyuncs.com
  # ↓↓↓ 改成你自己的 ACR 命名空间（ACR 控制台 → 命名空间 里的名字）
  ACR_NAMESPACE: ugreen_kangbin
  IMAGE_NAME: sonovel

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 关键：显式激活 linux-arm64、同时禁用自动激活的 linux-x64，
      # 保证打进 jar 的 Javet native 库是 linux arm64 版本
      - name: Build jar with linux-arm64 native libs
        run: |
          mvn clean package -P 'linux-arm64,!linux-x64' -Dmaven.test.skip=true
          cp target/app-jar-with-dependencies.jar app.jar
          cp bundle/config.ini .
          cp -r bundle/rules .
          ls -lh app.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # 阿里云 ACR 不支持 OCI attestation（provenance/SBOM），必须关闭，
          # 否则 push 报 unknown manifest class for application/vnd.oci.empty.v1+json
          provenance: false
          sbom: false
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || 'arm64' }}
